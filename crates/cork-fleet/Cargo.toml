[package]
name = "cork-fleet"
description = "Worker fleets for Cork: the model catalog, keyword routing and the supervisor."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
cork-core = { path = "../cork-core", version = "0.1.0" }
cork-api = { path = "../cork-api", version = "0.1.0" }
cork-client = { path = "../cork-client", version = "0.1.0" }
tokio = { version = "1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
