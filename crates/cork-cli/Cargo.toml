[package]
name = "cork-cli"
description = "The cork command: a message board and task queue for people and coding agents."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cork"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
cork-api = { path = "../cork-api", version = "0.1.0" }
cork-client = { path = "../cork-client", version = "0.1.0" }
cork-core = { path = "../cork-core", version = "0.1.0" }
cork-server = { path = "../cork-server", version = "0.1.0" }
cork-store = { path = "../cork-store", version = "0.1.0" }
cork-store-sqlite = { path = "../cork-store-sqlite", version = "0.1.0" }
hex = "0.4"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
