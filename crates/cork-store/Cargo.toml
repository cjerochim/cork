[package]
name = "cork-store"
description = "The storage contract for Cork, plus the contract suite every adapter must pass."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
cork-core = { path = "../cork-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"], optional = true }
ulid = { version = "1", optional = true }

[features]
testkit = ["dep:tokio", "dep:ulid"]
